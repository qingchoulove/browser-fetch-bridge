<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Browser Fetch Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="brand">
        <svg class="codex-mark" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M18.5 36.7c-6.4-.7-10.9-5.4-10.9-11.6 0-4.3 2.3-8.2 5.9-10.1C15.2 9.1 20.4 5.4 26 6.4c4 .7 7.1 3.4 8.4 7.1 4.1.9 6.9 4.2 6.9 8.4 0 4.8-3.7 8.5-8.6 8.8-1.9 4.4-6.4 7.1-11.1 6.6" />
          <path d="M17.4 20.1c-1.6 2.2-1.3 5.3.7 7.1" />
          <path d="M29.1 27.8c-2 1.4-4.8 1.4-6.9.1" />
        </svg>
        <h1>Browser Bridge</h1>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-card-top">
          <div id="status-pill" class="status-pill">
            <span id="status-dot" class="status-dot" aria-hidden="true"></span>
            <strong id="status-label">Checking</strong>
          </div>

          <button id="reconnect-button" class="icon-button" type="button" aria-label="Reconnect bridge" title="Reconnect bridge">
            <svg class="refresh-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 0 1-15.4 6.4L3 16"></path>
              <path d="M3 16h5v5"></path>
              <path d="M3 12A9 9 0 0 1 18.4 5.6L21 8"></path>
              <path d="M21 8h-5V3"></path>
            </svg>
            <span id="reconnect-label" class="sr-only">Reconnect</span>
          </button>
        </div>

        <p class="version">Version v0.1.0</p>
        <span id="bridge-url" class="sr-only">Loading...</span>
        <span id="last-connected" class="sr-only">Never</span>
        <span id="last-disconnected" class="sr-only">Never</span>
        <p id="error-message" class="error-message" hidden></p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
